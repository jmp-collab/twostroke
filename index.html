const b64=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw,keep){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim().toLowerCase()),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(META.s),iterations:META.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const data=await (await fetch("payload.bin",{cache:"no-cache"})).arrayBuffer();
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(META.i)},key,data);
  const html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  try{ if(keep) localStorage.setItem(KEY,pw.trim().toLowerCase()); }catch(e){}
  document.open(); document.write(html); document.close();
}
const f=document.getElementById("f"), msg=document.getElementById("msg"), go=document.getElementById("go");
f.addEventListener("submit",async(e)=>{e.preventDefault();go.disabled=true;msg.className="msg small";msg.textContent="Mini-Nina schließt auf...";
  try{await unlock(document.getElementById("pw").value,document.getElementById("keep").checked);}
  catch(err){go.disabled=false;msg.className="msg err";msg.textContent="Hmm, das war nicht das Passwort. Nochmal?";document.getElementById("fig").innerHTML=WRONG;}
});
try{const saved=localStorage.getItem(KEY); if(saved){msg.textContent="Willkommen zurück, Nina...";unlock(saved,true).catch(()=>{try{localStorage.removeItem(KEY);}catch(e){} msg.textContent="Bitte Passwort eingeben.";});}}catch(e){}
